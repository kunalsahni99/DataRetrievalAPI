[project]
name = "data-retrieval-api"
version = "0.1.0"
description = "This project acts as a helper API backend for the multi-agent architecture for M365 operational tasks and recommendation engine. Powered by FastAPI, it acts as a bridge between the end user and the multi agent system."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "msal>=1.37.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.49.0",
]
